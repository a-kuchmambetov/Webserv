<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Upload Test</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    h1 { font-size: 1.5rem; }
    form {
      border: 1px solid #ccc;
      padding: 1.5rem;
      border-radius: 6px;
    }
    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
    }
    input[type="file"] {
      display: block;
      margin-bottom: 1rem;
    }
    button {
      padding: 0.5rem 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <h1>Upload Test</h1>
  <form action="/upload" method="POST" enctype="multipart/form-data">
    <label for="file">Choose a file to upload</label>
    <input type="file" id="file" name="file" required multiple>
    <button type="submit">Upload</button>
  </form>
</body>
</html>
