# =========================
# SERVER 1: STATIC WEBSITE
# =========================
server {
    listen 127.0.0.1:8080
    listen 0.0.0.0:8080;
    server_name static.local;

    root ./www/static;
    index index.html;
    client_max_body_size 10M;

    location / {
        methods GET;
        index index.html;
        autoindex off;
    }
}