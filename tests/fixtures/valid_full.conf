# =========================================================
# webserv server.config
# Example syntax inspired by nginx
# 3 servers:
#   - static site      : 127.0.0.1:8080
#   - upload site      : 127.0.0.1:8081
#   - cgi site         : 127.0.0.1:8082
# =========================================================

# =========================
# SERVER 1: STATIC WEBSITE
# =========================
server {
    listen 0.0.0.0:8080;
    server_name static.local;

    root ./www/static;
    index index.html;
    client_max_body_size 10M;

    error_page 404 ./www/errors/404.html;

    location / {
        methods GET;
        index index.html;
        autoindex off;
    }
}